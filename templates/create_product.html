<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Inventario - Registro de Productos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4">

    <div class="container mb-4" style="max-width: 500px;">
        <div class="d-flex justify-content-around border-bottom pb-2">
            <a href="/products/new" class="fw-bold text-dark text-decoration-none">Registrar Producto</a>
            <a href="/products/search" class="text-secondary text-decoration-none">Buscar Productos</a>
        </div>
    </div>

    <div class="container" style="max-width: 500px;">
        <div class="border p-4 rounded bg-white">
            <h2 class="h4 text-dark">Registro de Productos</h2>
            <hr>
            
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="alert alert-secondary py-2" role="alert">
                            {{ message }}
                        </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form action="/products/new" method="POST">
                <div class="mb-3">
                    <label class="form-label">Nombre del producto *</label>
                    <input type="text" class="form-control" name="nombre" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Descripción</label>
                    <textarea class="form-control" name="descripcion" rows="2" placeholder="Breve descripción del producto..."></textarea>
                </div>

                <div class="mb-3">
                    <label class="form-label">Precio *</label>
                    <input type="number" step="0.01" class="form-control" name="precio" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Stock *</label>
                    <input type="number" class="form-control" name="stock" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Categoría *</label>
                    <select class="form-select" name="categoria" required>
                        <option value="" disabled selected>Seleccione una opción</option>
                        <option value="Lacteos">Lácteos</option>
                        <option value="Carnes">Carnes</option>
                        <option value="Abarrotes">Abarrotes</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">URL de la Imagen</label>
                    <input type="url" class="form-control" name="imagen" placeholder="https://enlace-de-la-imagen.com/foto.jpg">
                </div>

                <button type="submit" class="btn btn-primary w-100">Guardar Producto</button>
            </form>
        </div>
    </div>

</body>
</html>
