<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Inventario - Actualizar Stock</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4">

    {% extends 'index.html' %}
{% block content %}

<div class="d-flex justify-content-between flex-wrap flex-md-nowrap
  align-items-center pt-3 pb-2 mb-3 border-bottom border-secondary">
  <h1 class="h3 text-white fw-bold">
    <i class="bi bi-arrow-repeat text-info me-2"></i>HU03 — Actualizar Stock de Producto
  </h1>
</div>

<div class="card card-custom p-4 shadow" style="max-width: 700px;">
  <form action="/products/update-stock" method="POST">
    <div class="row g-3">

      <div class="col-12">
        <label class="form-label">Selecciona un Producto *</label>
        <select class="form-select form-dark" name="producto_id" required>
          <option value="" disabled selected>Seleccione un producto</option>
          {% for p in productos %}
          <option value="{{ p._id }}">
            {{ p.nombre }} — Stock actual: {{ p.stock }} uds.
          </option>
          {% endfor %}
        </select>
      </div>

      <div class="col-12">
        <label class="form-label">Nuevo Stock *</label>
        <input type="number" class="form-control form-dark"
          name="nuevo_stock" min="0" placeholder="Cantidad" required>
        <div class="form-text text-muted">No se permiten valores negativos.</div>
      </div>

      <div class="col-12 pt-2">
        <button type="submit" class="btn btn-success w-100 fw-bold py-2">
          <i class="bi bi-arrow-repeat"></i> Actualizar Stock
        </button>
      </div>

    </div>
  </form>
</div>

{% endblock %}
</body>
</html>
